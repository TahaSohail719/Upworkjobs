<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CentOps Proposal Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }
        
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        
        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            padding: 30px;
            min-height: 600px;
        }
        
        .input-section, .output-section {
            display: flex;
            flex-direction: column;
        }
        
        label {
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
            font-size: 14px;
        }
        
        textarea {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            transition: border-color 0.2s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .button-group {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }
        
        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .generate-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .generate-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .generate-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .copy-btn {
            background: #4CAF50;
            color: white;
        }
        
        .copy-btn:hover {
            background: #45a049;
        }
        
        .clear-btn {
            background: #f44336;
            color: white;
        }
        
        .clear-btn:hover {
            background: #da190b;
        }
        
        .output-text {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: #fafafa;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            line-height: 1.6;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        
        .loading {
            text-align: center;
            color: #667eea;
            font-weight: 600;
        }
        
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(102, 126, 234, 0.2);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error {
            color: #d32f2f;
            padding: 12px;
            background: #ffebee;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 15px;
        }
        
        .success-badge {
            display: inline-block;
            background: #4CAF50;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-left: 10px;
        }
        
        .mode-btn {
            padding: 8px 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            background: transparent;
            color: white;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .mode-btn:hover {
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.1);
        }
        
        .mode-btn.active {
            background: rgba(255, 255, 255, 0.2);
            border-color: white;
        }
        
        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 20px;
            }
            
            .header {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Proposal Generator</h1>
            <p>Paste Upwork job description → Get strategic proposal in seconds</p>
            <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: center;">
                <button class="mode-btn active" data-mode="centops">Company Profile (CentOps)</button>
                <button class="mode-btn" data-mode="personal">Personal Profile</button>
            </div>
        </div>
        
        <div class="content">
            <div class="input-section">
                <label for="jobDescription">Upwork Job Description</label>
                <textarea id="jobDescription" placeholder="Paste the complete Upwork job posting here..."></textarea>
                <div class="button-group">
                    <button class="generate-btn" id="generateBtn">Generate Proposal</button>
                    <button class="clear-btn" id="clearBtn">Clear</button>
                </div>
                <div style="font-size: 12px; color: #666; margin-top: 10px;">
                    💡 Pro tip: Include budget, timeline, and any specific tech stack in the job description for better results
                </div>
            </div>
            
            <div class="output-section">
                <label for="proposalOutput">Your Proposal <span id="copyBadge"></span></label>
                <div class="output-text" id="proposalOutput">Your proposal will appear here...</div>
                <div class="button-group">
                    <button class="copy-btn" id="copyBtn" style="display: none;">📋 Copy to Clipboard</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const generateBtn = document.getElementById('generateBtn');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');
        const jobDescriptionArea = document.getElementById('jobDescription');
        const proposalOutput = document.getElementById('proposalOutput');
        const copyBadge = document.getElementById('copyBadge');
        const modeBtns = document.querySelectorAll('.mode-btn');
        
        let selectedMode = 'centops';

        // Mode switching
        modeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                modeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedMode = btn.dataset.mode;
                proposalOutput.textContent = 'Your proposal will appear here...';
                copyBtn.style.display = 'none';
                copyBadge.textContent = '';
            });
        });

        clearBtn.addEventListener('click', () => {
            jobDescriptionArea.value = '';
            proposalOutput.textContent = 'Your proposal will appear here...';
            copyBtn.style.display = 'none';
            copyBadge.textContent = '';
        });

        copyBtn.addEventListener('click', () => {
            const text = proposalOutput.textContent;
            navigator.clipboard.writeText(text).then(() => {
                copyBadge.textContent = '✓ Copied!';
                copyBadge.style.color = '#4CAF50';
                setTimeout(() => {
                    copyBadge.textContent = '';
                }, 2000);
            });
        });

        function getPrompt(jobDescription, mode) {
            if (mode === 'centops') {
                return `You are a proposal writer for CentOps Consulting, a Pakistan-based Odoo ERP implementation, AI business automation, and bookkeeping firm.

CentOps Core Services:
- Odoo ERP implementation & customization (any version)
- Odoo + Shopify real-time 2-way sync connector
- AI-driven business process automation
- Odoo bookkeeping & financial operations
- Module development & technical integration

Past Relevant Wins (use ONLY if niche matches):
- Avant Garde Original (Lahore premium fashion): Odoo customization, ZKT biometric integration, health dashboards
- Le French Club: Membership management on Odoo 19, POS configuration
- ASR BPO: ERP pitch for construction company (BOQ integration)

Your tone: Consultative & strategic. Ask clarifying questions through the proposal. Focus on understanding the client's pain points before jumping to solutions.

Here is the Upwork job posting:

${jobDescription}

Generate ONE professional proposal that:
1. Opens with a brief, consultative summary of what we understand from the posting
2. Asks 2-3 strategic clarifying questions (without making it sound like we're unsure)
3. Proposes the CentOps approach—reference specific services ONLY if they match the job niche
4. If the niche matches Avant Garde (fashion/retail), Le French Club (clubs/hospitality), or ASR (construction), lightly reference it ("We've worked with similar businesses...")
5. Closes with clear next steps & call to action
6. Keep it under 250 words—consultative, not salesy
7. Use professional but warm tone; avoid buzzwords
8. Use "we" and "our" throughout (company voice)

Output ONLY the proposal text. No meta-commentary, no "Here's your proposal:", just the clean text ready to paste into Upwork.`;
            } else {
                return `You are a consultant writing proposals for Upwork. You are an Odoo ERP specialist with 3+ years of experience in:
- Odoo ERP implementation & customization (any version)
- Odoo + Shopify real-time 2-way sync integration
- AI-driven business process automation
- Odoo bookkeeping & financial operations
- Custom module development

Your expertise includes work with premium fashion/retail brands, hospitality clients, construction companies, and more. You have hands-on experience across Pakistani and international markets.

Your tone: Consultative & strategic. Ask clarifying questions through the proposal. Focus on understanding the client's pain points before jumping to solutions.

Here is the Upwork job posting:

${jobDescription}

Generate ONE professional proposal that:
1. Opens with a brief, consultative summary of what you understand from the posting
2. Asks 2-3 strategic clarifying questions (without making it sound like you're unsure)
3. Propose your approach—reference your specific expertise ONLY if it matches the job niche
4. If relevant, lightly mention your experience ("I've worked with similar businesses...")
5. Closes with clear next steps & call to action
6. Keep it under 250 words—consultative, not salesy
7. Use professional but warm tone; avoid buzzwords
8. Use "I" and "my" throughout (personal consultant voice)

Output ONLY the proposal text. No meta-commentary, no "Here's your proposal:", just the clean text ready to paste into Upwork.`;
            }
        }

        generateBtn.addEventListener('click', async () => {
            const jobDescription = jobDescriptionArea.value.trim();
            
            if (!jobDescription) {
                proposalOutput.innerHTML = '<div class="error">Please paste a job description first.</div>';
                return;
            }

            generateBtn.disabled = true;
            proposalOutput.innerHTML = '<div class="loading"><span class="spinner"></span>Generating consultative proposal...</div>';
            copyBtn.style.display = 'none';

            try {
                const response = await fetch("https://api.anthropic.com/v1/messages", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({
                        model: "claude-sonnet-4-6",
                        max_tokens: 1000,
                        messages: [
                            {
                                role: "user",
                                content: getPrompt(jobDescription, selectedMode)
                            }
                        ],
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    proposalOutput.innerHTML = `<div class="error">API Error: ${data.error.message}</div>`;
                } else if (data.content && data.content[0]) {
                    const proposalText = data.content[0].text;
                    proposalOutput.textContent = proposalText;
                    copyBtn.style.display = 'block';
                    copyBadge.innerHTML = '<span class="success-badge">Ready to copy</span>';
                } else {
                    proposalOutput.innerHTML = '<div class="error">Unexpected API response.</div>';
                }
            } catch (error) {
                proposalOutput.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            } finally {
                generateBtn.disabled = false;
            }
        });

        jobDescriptionArea.addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter' || e.metaKey && e.key === 'Enter') {
                generateBtn.click();
            }
        });
    </script>
</body>
</html>
